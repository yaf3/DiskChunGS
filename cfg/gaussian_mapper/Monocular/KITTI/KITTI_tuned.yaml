%YAML:1.0

#--------------------------------------------------------------------------------------------
# Model Parameters
#--------------------------------------------------------------------------------------------

Model.sh_degree: 3
Model.resolution: -1.0
Model.white_background: 0
Model.eval: 0

#--------------------------------------------------------------------------------------------
# Pipeline Parameters
#--------------------------------------------------------------------------------------------

Camera.z_near: 0.01
Camera.z_far: 1000.0
Monocular.inactive_geo_densify_max_pixel_dist: 12.0  # Increased significantly for more geometric points
Stereo.min_disparity: 8
Stereo.num_disparity: 128
Mapper.min_depth_: 0.0000000001
Mapper.max_depth_: 40.0

Mapper.inactive_geo_densify: 1
Mapper.depth_cache: 30  # Increased to accumulate more points
Mapper.min_num_initial_map_kfs: 15
Mapper.new_keyframe_times_of_use: 40  # Significantly increased for more optimization chances
Mapper.local_BA_increased_times_of_use: 2  # Added some local BA reoptimization
Mapper.loop_closure_increased_times_of_use_: 4  # Increased loop closure optimization
Mapper.cull_keyframes: 0
Mapper.large_rotation_threshold: 0.1
Mapper.large_translation_threshold: 0.01
Mapper.stable_num_iter_existence: 5  # Increased stability requirement

GausPyramid.do: 1
GausPyramid.num_sub_levels: 4  # Increased levels for more detail preservation
GausPyramid.sub_level_times_of_use: 12  # Increased iterations per level

Pipeline.convert_SHs: 0
Pipeline.compute_cov3D: 0

Record.keyframe_record_interval: 0
Record.all_keyframes_record_interval: 0
Record.record_rendered_image: 1
Record.record_ground_truth_image: 0
Record.record_loss_image: 0
Record.training_report_interval: 0
Record.record_loop_ply: 0

#--------------------------------------------------------------------------------------------
# Optimization Parameters
#--------------------------------------------------------------------------------------------

Optimization.max_num_iterations: 100000  # Significantly increased total iterations
Optimization.position_lr_init: 0.00008  # Reduced for stability with many points
Optimization.position_lr_final: 0.00002
Optimization.position_lr_delay_mult: 0.01
Optimization.position_lr_max_steps: 50  # Increased steps for learning rate schedule
Optimization.feature_lr: 0.001  # Reduced for stability
Optimization.opacity_lr: 0.015  # Reduced for stability
Optimization.scaling_lr: 0.001  # Reduced for stability
Optimization.rotation_lr: 0.0003  # Reduced for stability
Optimization.smooth_l1: 1  # Enabled for better gradient behavior
Optimization.opacity_reg: 0.0005  # Significantly reduced to preserve more points

Optimization.percent_dense: 0.1  # Significantly increased to allow very dense regions
Optimization.lambda_dssim: 0.3  # Increased focus on structural similarity
Optimization.densification_interval: 50  # More frequent densification
Optimization.opacity_reset_interval: 0
Optimization.prune_big_point_after_iter: 80000  # Much later pruning of large points
Optimization.densify_min_opacity: 0.005  # Much lower threshold to keep points
Optimization.densify_from_iter: 500  # Earlier densification
Optimization.densify_until_iter: 90000  # Much longer densification period
Optimization.densify_grad_threshold: 0.0005  # Much lower threshold to create more points
Optimization.auto_distribute: 1  # Enable CartGS-style optimization distribution

#--------------------------------------------------------------------------------------------
# Viewer Parameters
#--------------------------------------------------------------------------------------------

GaussianViewer.glfw_window_width: 1400
GaussianViewer.glfw_window_height: 1050
GaussianViewer.image_scale: 0.5
GaussianViewer.image_scale_main: 1.0
GaussianViewer.camera_watch_dist: 0.000001