%YAML:1.0

#--------------------------------------------------------------------------------------------
# Camera Parameters. Adjust them!
#--------------------------------------------------------------------------------------------
File.version: "1.0"
Camera.type: "PinHole"

# Left Camera calibration and distortion parameters (OpenCV) 
Camera1.fx: 1265.4157426547047
Camera1.fy: 1259.125033829179
Camera1.cx: 649.1764873455104
Camera1.cy: 349.11875004082356
Camera1.k1: -0.15442153959026667
Camera1.k2: 0.22415792664801637
Camera1.p1: 0.00028611532170761544
Camera1.p2: -0.0011553024948397013

# Right Camera calibration and distortion parameters (OpenCV) 
Camera2.fx: 1270.980680475146
Camera2.fy: 1266.6167801504557
Camera2.cx: 692.2080529147544
Camera2.cy: 346.53773474480096
Camera2.k1: -0.13964919973164264
Camera2.k2: 0.3032246444678759
Camera2.p1: -0.0006841993380782645
Camera2.p2: -0.0017521213083201822

# Camera resolution
Camera.width: 1388
Camera.height: 700

# Camera frames per second 
Camera.fps: 30

# Color order of the images (0: BGR, 1: RGB. It is ignored if images are grayscale)
Camera.RGB: 1

# Stereo baseline * fx
Stereo.ThDepth: 35.0

# Transformation matrix from right camera to left camera
Stereo.T_c1_c2: !!opencv-matrix
   rows: 4
   cols: 4
   dt: f
   data: [  0.999942761246,    -0.004045119148590, -0.009905111953195,  0.480947254247220,
            0.003934668351673,  0.999930150128060, -0.011145099812895,  0.011045941526715,
            0.009949503339060,  0.011105488550746,  0.999888831574470, -0.008664925692725,
            0.000000000000000,  0.000000000000000,  0.000000000000000,  1.000000000000000]

#--------------------------------------------------------------------------------------------
# ORB Parameters
#--------------------------------------------------------------------------------------------
# ORB Extractor: Number of features per image
ORBextractor.nFeatures: 1200

# ORB Extractor: Scale factor between levels in the scale pyramid 	
ORBextractor.scaleFactor: 1.2

# ORB Extractor: Number of levels in the scale pyramid	
ORBextractor.nLevels: 8

# ORB Extractor: Fast threshold	
ORBextractor.iniThFAST: 20
ORBextractor.minThFAST: 7

#--------------------------------------------------------------------------------------------
# Viewer Parameters
#--------------------------------------------------------------------------------------------
Viewer.KeyFrameSize: 0.05
Viewer.KeyFrameLineWidth: 1.0
Viewer.GraphLineWidth: 0.9
Viewer.PointSize: 2.0
Viewer.CameraSize: 0.08
Viewer.CameraLineWidth: 3.0
Viewer.ViewpointX: 0.0
Viewer.ViewpointY: -0.7
Viewer.ViewpointZ: -1.8
Viewer.ViewpointF: 500.0
Viewer.imageViewScale: 1.0