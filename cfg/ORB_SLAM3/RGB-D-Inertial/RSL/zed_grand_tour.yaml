%YAML:1.0
#--------------------------------------------------------------------------------------------
# Camera Parameters. Adjust them!
#--------------------------------------------------------------------------------------------
File.version: "1.0"
Camera.type: "Rectified"

# Camera calibration parameters
Camera1.fx: 1071.5899658203125
Camera1.fy: 1071.52001953125
Camera1.cx: 955.7899780273438
Camera1.cy: 552.7760009765625

# Camera frames per second
Camera.fps: 15

# Color order of the images (0: BGR, 1: RGB)
Camera.RGB: 1

# Camera resolution
Camera.width: 1920
Camera.height: 1080

# Close/Far threshold. Baseline times.
Stereo.ThDepth: 40.0
Stereo.b: 0.12

# RGBD Parameters
RGBD.DepthMapFactor: 1000.0

# Camera-IMU extrinsic calibration
IMU.T_b_c1: !!opencv-matrix
    rows: 4
    cols: 4
    dt: f
    data: [-0.000014, -0.0139993, 0.999902, 0.023,
           -0.999998, 0.0019999, 0.000014, 0.0, 
           -0.0019999, -0.9999, -0.0139993, -0.002,
           0.0, 0.0, 0.0, 1.0]

# IMU noise parameters (from ZED2i examples)
IMU.NoiseGyro: 0.007000000216066837
IMU.NoiseAcc: 0.016
IMU.GyroWalk: 0.0019474000437185168
IMU.AccWalk: 0.0002508999896235764
IMU.Frequency: 100.0

#--------------------------------------------------------------------------------------------
# ORB Parameters
#--------------------------------------------------------------------------------------------
ORBextractor.nFeatures: 2000
ORBextractor.scaleFactor: 1.2
ORBextractor.nLevels: 8
ORBextractor.iniThFAST: 20
ORBextractor.minThFAST: 7

#--------------------------------------------------------------------------------------------
# Viewer Parameters
#--------------------------------------------------------------------------------------------
Viewer.KeyFrameSize: 0.05
Viewer.KeyFrameLineWidth: 1.0
Viewer.GraphLineWidth: 0.9
Viewer.PointSize: 2.0
Viewer.CameraSize: 0.08
Viewer.CameraLineWidth: 3.0
Viewer.ViewpointX: 0.0
Viewer.ViewpointY: -0.7
Viewer.ViewpointZ: -1.8
Viewer.ViewpointF: 500.0